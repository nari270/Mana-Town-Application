services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mana_town
      POSTGRES_USER: mana
      POSTGRES_PASSWORD: mana_local_only
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mana -d mana_town']
      interval: 5s
      timeout: 5s
      retries: 10
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mana_town_test
      POSTGRES_USER: mana
      POSTGRES_PASSWORD: mana_local_only
    ports:
      - '5433:5432'
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mana -d mana_town_test']
      interval: 5s
      timeout: 5s
      retries: 10
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: local-development-only
      MINIO_ROOT_PASSWORD: local-development-only
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
volumes:
  postgres_data:
  postgres_test_data:
  minio_data:
