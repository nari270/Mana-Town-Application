name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mana_town_test
          POSTGRES_USER: mana
          POSTGRES_PASSWORD: mana_local_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mana -d mana_town_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://mana:mana_local_only@localhost:5432/mana_town_test?schema=public
      DIRECT_URL: postgresql://mana:mana_local_only@localhost:5432/mana_town_test?schema=public
      NODE_ENV: test
      AUTH_JWT_SECRET: ci-only-signing-secret-not-used-anywhere-else
      SEED_DEMO_DATA: 'true'
      SEED_PASSWORD_ADMIN: ci-only-admin-password
      SEED_PASSWORD_OWNER: ci-only-owner-password
      SEED_PASSWORD_RESIDENT: ci-only-resident-password
      SEED_PASSWORD_ENTREPRENEUR: ci-only-entrepreneur-password
      MANA_TOWN_ALLOW_DB_INTEGRATION: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: cp .env.example .env
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true # remaining fixes need major upgrades; tracked in docs/testing.md
      - run: npm run db:generate
      - run: npm run db:validate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
      - run: npx tsx apps/api/prisma/seed.ts
      - run: npm run test:integration
      - run: npm run build
