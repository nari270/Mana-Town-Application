services:
  - type: web
    name: manatown-api
    branch: version1.1
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run db:generate -w @mana-town/api && npm run build -w @mana-town/api && npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
    startCommand: npm run start:prod -w @mana-town/api
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: 'false'
      - key: CLIENT_ORIGIN
        value: https://manatown-web.onrender.com
      - key: GEOCODING_BASE_URL
        sync: false
      - key: GEOCODING_USER_AGENT
        sync: false
      - key: GEOCODING_ATTRIBUTION
        sync: false

  - type: web
    name: manatown-web
    branch: version1.1
    runtime: static
    buildCommand: npm ci --include=dev && npm run build -w @mana-town/client
    staticPublishPath: apps/client/dist
    envVars:
      - key: EXPO_PUBLIC_API_URL
        value: https://manatown-api.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
